name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python tests (Ubuntu, no GPU / model)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install FFmpeg (system binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          python -m pytest tests/ -q --cov=lib --cov=services --cov=repositories --cov-report=term-missing
