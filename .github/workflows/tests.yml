name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu Python 3.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install FFmpeg (system binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Ruff changed Python files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.py')"
          if [ -z "$files" ]; then
            echo "No changed Python files."
          else
            # The repository predates Ruff and intentionally keeps its existing
            # formatting/exception style; fail the changed-file gate on real
            # undefined-name/import errors without rewriting unrelated legacy code.
            python -m ruff check --select F $files
          fi

      - name: Run full test suite
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          python -m pytest tests/ -q --cov=lib --cov=services --cov=repositories --cov-report=term-missing

  windows:
    name: Windows Python 3.10 selected workflow tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Windows capability regression tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/test_{windows_*,start_bat_encoding.py,no_hardcoded_paths.py,workspace_paths.py,environment_diagnostics.py,launcher.py,studio_lifecycle.py,chapter_identity.py} \
            tests/test_{project_*,catalog_*,bookshelf_*}.py \
            tests/test_storage_*.py \
            tests/test_{engine_*,runtime_*,production_*,startup_phases.py,application_lifecycle.py} \
            tests/test_{o12_cancel_during_pause.py,o12_state_machine.py,cancellation_state.py,synthesis_service.py,partial_production_scope.py} \
            tests/test_{quality*,batch_qa_terminal_refresh.py,repair*,delivery_freshness.py} \
            tests/test_{export_*,workflow_export*.py,audio_pipeline*.py,metadata.py} \
            tests/test_{supplement*,unified_supplement_quick_tts.py} \
            tests/test_{voice_*,o5_preview.py,o9_voice_lib.py,o13_merge_preview.py,tts_engine*.py,tts_profile_adapter.py,mcp_server.py} \
            tests/test_{prewarm.py,performance_trace.py,performance_trace_integration.py,incident_observability.py} \
            tests/test_{structured_script_import.py,task_repo.py,binding_repo.py,session_snapshot.py,hotpath_optimizations.py} \
            tests/workflows/test_{*_lifecycle.py,export_mixed_audio.py,data_dir_switch.py}
