name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu Python 3.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install FFmpeg (system binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Ruff changed Python files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.py')"
          if [ -z "$files" ]; then
            echo "No changed Python files."
          else
            # The repository predates Ruff and intentionally keeps its existing
            # formatting/exception style; fail the changed-file gate on real
            # undefined-name/import errors without rewriting unrelated legacy code.
            python -m ruff check --select F $files
          fi

      - name: Run full test suite
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          python -m pytest tests/ -q --cov=lib --cov=services --cov=repositories --cov-report=term-missing

  windows:
    name: Windows Python 3.10 selected workflow tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Windows path, project, runtime, QA and delivery tests
        env:
          PYTHONUTF8: "1"
        run: >-
          python -m pytest -q
          tests/test_structured_script_import.py
          tests/test_project_repo.py
          tests/test_project_service.py
          tests/test_project_manager.py
          tests/test_project_snapshot.py
          tests/test_binding_repo.py
          tests/test_session_snapshot.py
          tests/test_app_glue.py
          tests/test_app_wiring.py
          tests/test_ui_layout_regression.py
          tests/test_workspace_paths.py
          tests/test_voice_cast_phase2.py
          tests/test_task_repo.py
          tests/test_production_jobs.py
          tests/test_production_runtime.py
          tests/test_runtime_tts.py
          tests/test_production_mutation_guard.py
          tests/test_o12_state_machine.py
          tests/test_cancellation_state.py
          tests/test_quality_phase4.py
          tests/test_delivery_freshness.py
          tests/test_repair_phase4.py
          tests/test_workflow_export_phase4.py
          tests/test_export_duration.py
          tests/test_audio_pipeline_streaming.py
          tests/test_export_r2.py
          tests/test_project_backup.py
          tests/test_mcp_server.py
          tests/workflows/test_project_lifecycle.py
